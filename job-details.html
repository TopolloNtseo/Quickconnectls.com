<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details — Quick Connect LS</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <div id="header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumbs">
        <a href="/index.html">Home</a>
        <span>›</span>
        <a href="/jobs.html">Jobs</a>
        <span>›</span>
        <span>Job Details</span>
      </div>

      <h1 class="page-title">Job Details</h1>
      <p class="page-subtitle">
        View job information and apply if you're interested.
      </p>
    </div>
  </section>

  <main class="section">
    <div class="container">

      <!-- Loading Card -->
      <div class="card" id="loadingCard">
        <p class="muted" id="jobIdText">Loading job...</p>
      </div>

      <!-- Firebase will render job details here -->
      <div id="jobDetails" class="card" style="margin-top:15px;"></div>

      <!-- Actions -->
      <div class="form-actions" style="margin-top:15px;">
        <a class="btn btn-primary" href="/auth.html">
          Apply
        </a>

        <a class="btn btn-outline" href="/jobs.html">
          Back to Jobs
        </a>
      </div>

    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/include.js"></script>

  <!-- Job Details Script -->
  <script type="module" src="assets/js/job-details.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get("id") || "N/A";

    document.getElementById("jobIdText").textContent =
      `Job ID: ${jobId}`;
  </script>

</body>
</html>
