<!-- Job Card Component -->
<article class="card job-card">
  <div class="job-top">
    <div>
      <h3 class="job-title">Job Title</h3>
      <p class="job-company">Company Name</p>
    </div>
    <span class="pill">Category</span>
  </div>

  <ul class="job-meta">
    <li><i class="bx bx-map"></i> Location</li>
    <li><i class="bx bx-filter"></i> Job Type</li>
    <li><i class="bx bx-time"></i> Posted X days ago</li>
  </ul>

  <a class="btn btn-primary" href="/job-details.html">View / Apply</a>
</article>
