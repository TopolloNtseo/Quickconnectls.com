<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Job — Quick Connect LS</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>

  <div id="header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumbs">
        <a href="/index.html">Home</a>
        <span>›</span>
        <span>Employer</span>
        <span>›</span>
        <span>Post a Job</span>
      </div>

      <h1 class="page-title">Post a Job</h1>
      <p class="page-subtitle">
        Create a job listing and connect with workers quickly.
      </p>
    </div>
  </section>

  <main class="section section-alt">
    <div class="container form-layout">

      <section class="card">

        <div class="dash-head">
          <h2 class="dash-title">Job Details</h2>
          <a class="btn btn-outline" href="/employer/dashboard.html">
            Back to Dashboard
          </a>
        </div>

        <form id="postJobForm" class="form-stack">

          <div class="grid-2-form">

            <div class="field">
              <label for="title">Job Title *</label>
              <input
                id="title"
                type="text"
                placeholder="e.g. House Cleaner"
                required
              />
            </div>

            <div class="field">
              <label for="location">Location *</label>
              <select id="location" required>
                <option value="">Select location</option>
                <option>Maseru</option>
                <option>Leribe</option>
                <option>Thaba-Tseka</option>
                <option>Mafeteng</option>
                <option>Mohale's Hoek</option>
                <option>Quthing</option>
                <option>Butha-Buthe</option>
                <option>Mokhotlong</option>
                <option>Qacha's Nek</option>
                <option>Berea</option>
              </select>
            </div>

          </div>

          <div class="grid-2-form">

            <div class="field">
              <label for="startTime">Start Time *</label>
              <input
                id="startTime"
                type="datetime-local"
                required
              />
            </div>

            <div class="field">
              <label for="duration">Duration *</label>
              <select id="duration" required>
                <option value="">Select duration</option>
                <option>Few Hours</option>
                <option>1 Day</option>
                <option>2–3 Days</option>
                <option>1 Week</option>
                <option>2 Weeks</option>
                <option>1 Month</option>
                <option>More than 1 Month</option>
              </select>
            </div>

          </div>

          <div class="grid-2-form">

            <div class="field">
              <label for="payment">Payment *</label>
              <input
                id="payment"
                type="text"
                placeholder="e.g. M250, M500/day, Negotiable"
                required
              />
            </div>

            <div class="field">
              <label for="workersNeeded">Workers Needed</label>
              <input
                id="workersNeeded"
                type="number"
                min="1"
                placeholder="e.g. 3"
              />
            </div>

          </div>

          <div class="field">
            <label for="description">Job Description</label>
            <textarea
              id="description"
              rows="5"
              placeholder="Describe the job and what workers will be expected to do."
            ></textarea>
          </div>

          <div class="field">
            <label for="terms">Terms & Conditions</label>
            <textarea
              id="terms"
              rows="4"
              placeholder="Optional requirements, rules or special instructions."
            ></textarea>
          </div>

          <div class="check-row">
            <label>
              <input id="agree" type="checkbox" required />
              I confirm this job is legitimate.
            </label>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit">
              Publish Job
            </button>

            <button class="btn btn-outline" type="reset">
              Clear
            </button>
          </div>

          <div id="postJobMsg" class="auth-message" hidden></div>

        </form>

      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/include.js"></script>
  <script type="module" src="../assets/js/employer.js"></script>
  <script type="module" src="../assets/js/postJob.js"></script>
</body>
</html>
