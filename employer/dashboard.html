<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employer Dashboard — Quick Connect LS</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>

  <div id="header"></div>

  <section class="page-head">
    <div class="container">

      <div class="breadcrumbs">
        <a href="/index.html">Home</a>
        <span>›</span>
        <span>Employer</span>
        <span>›</span>
        <span>Dashboard</span>
      </div>

      <h1 class="page-title" id="companyName">Loading company...</h1>
      <p class="page-subtitle">Manage your job posts and applicants.</p>

      <button id="logoutBtn" class="btn btn-outline" style="margin-top:10px;">
        Logout
      </button>

    </div>
  </section>

  <main class="section section-alt">
    <div class="container">

      <!-- Stats -->
      <section class="dash-stats">

        <div class="card stat">
          <p class="stat-label">Active Jobs</p>
          <h2 class="stat-value" id="activeJobs">0</h2>
        </div>

        <div class="card stat">
          <p class="stat-label">Total Jobs</p>
          <h2 class="stat-value" id="totalJobs">0</h2>
        </div>

      </section>

      <!-- Jobs Table -->
      <section class="dash-grid">

        <div class="card">
          <div class="dash-head">
            <h2 class="dash-title">Your Job Posts</h2>
            <a class="btn btn-primary" href="/employer/post-job.html">
              + Post a Job
            </a>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Job Title</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="jobsTableBody"></tbody>
            </table>
          </div>

        </div>

      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="../assets/js/employer.js"></script>
  <script src="../assets/js/include.js"></script>

</body>
</html>
