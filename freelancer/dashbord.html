<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freelancer Dashboard — Quick Connect LS</title>

  <link rel="stylesheet" href="../assets/css/main.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

  <div id="header"></div>

  <section class="page-head">
    <div class="container">

      <div class="breadcrumbs">
        <a href="/index.html">Home</a>
        <span>›</span>
        <span>Freelancer</span>
        <span>›</span>
        <span>Dashboard</span>
      </div>

      <h1 class="page-title" id="username">Loading user...</h1>
      <p class="page-subtitle">Manage your profile and track applications.</p>

      <button id="logoutBtn" class="btn btn-outline" style="margin-top:10px;">
        Logout
      </button>

    </div>
  </section>

  <main class="section section-alt">
    <div class="container">

      <!-- STATS -->
      <section class="dash-stats">

        <div class="card stat">
          <p class="stat-label">Applications</p>
          <h2 class="stat-value" id="statApplications">0</h2>
        </div>

        <div class="card stat">
          <p class="stat-label">Shortlisted</p>
          <h2 class="stat-value" id="statShortlisted">0</h2>
        </div>

        <div class="card stat">
          <p class="stat-label">Rejected</p>
          <h2 class="stat-value" id="statRejected">0</h2>
        </div>

      </section>

      <!-- PROFILE -->
      <section class="dash-grid">

        <div class="card">

          <div class="dash-head">
            <h2 class="dash-title">Profile Settings</h2>
            <button class="btn btn-primary" id="saveProfileBtn">Save</button>
          </div>

          <div class="form-group">
            <label>Username</label>
            <input type="text" id="usernameInput" placeholder="Username" />
          </div>

          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstNameInput" />
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastNameInput" />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phoneInput" placeholder="+266..." />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="emailInput" disabled />
          </div>

          <button class="btn btn-danger" id="deleteAccountBtn" style="margin-top:15px;">
            Delete Account
          </button>

        </div>

      </section>

      <!-- APPLICATIONS -->
      <section class="dash-grid">

        <div class="card">

          <div class="dash-head">
            <h2 class="dash-title">Your Applications</h2>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Job Title</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>

              <tbody id="applicationsTable"></tbody>
            </table>
          </div>

        </div>

      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script src="../assets/js/include.js"></script>
  <script type="module" src="../assets/js/freelancer.js"></script>

</body>
</html>
